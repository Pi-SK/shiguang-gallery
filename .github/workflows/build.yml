name: Build Desktop

# 推送 vX.Y.Z 标签时触发：多平台打包并上传到对应 Release
# 例：git tag v2.0.1 && git push origin v2.0.1
on:
  push:
    tags:
      - 'v*'

# 需要写入权限以创建 Release 并上传产物
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # tauri-action：按当前平台执行 tauri build，
      # 产物（Windows 为 NSIS 安装包，macOS 为 .app.tar.gz / .dmg）
      # 自动上传到标签对应的 GitHub Release
      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '拾光 · 画廊 ${{ github.ref_name }}'
          releaseBody: |
            ## 安装说明

            **Windows**：下载 `.exe` 安装包（NSIS 安装器）
            **macOS**：下载 `.dmg` 或 `.app.tar.gz`

            > ⚠️ **Edge / SmartScreen 拦截提示**
            > 因安装包尚未经过 Microsoft 代码签名认证，Edge 浏览器或 Windows SmartScreen 可能会弹出"此应用可能不安全"的拦截提示。
            > 这属于正常现象，请点击 **"仍要保留"** 或 **"更多信息 → 仍要运行"** 继续安装。
            > macOS 用户如遇 Gatekeeper 拦截，请右键 `.dmg` → **打开** → **打开**。
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
