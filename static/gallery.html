<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾光 — 摄影作品</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0a0a0a;
        --text-primary: rgba(255, 255, 255, 0.85);
        --text-secondary: rgba(255, 255, 255, 0.5);
        --text-faint: rgba(255, 255, 255, 0.3);
        --serif:
          "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
        --sans:
          "Noto Sans SC", "Source Han Sans SC", "PingFang SC", -apple-system,
          sans-serif;
        --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
        --duration: 700ms;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text-primary);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* ═══ 封面 ═══ */
      #cover {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        transition:
          opacity 1s var(--ease),
          visibility 1s;
        animation: coverReveal 1.8s var(--ease);
      }
      @keyframes coverReveal {
        from {
          opacity: 0;
        }
      }
      #cover.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #cover .cover-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.35;
        filter: brightness(0.7);
      }
      #cover .cover-content {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 2rem;
      }
      #cover .photographer-name {
        font-family: var(--serif);
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 400;
        letter-spacing: 0.15em;
        margin-bottom: 1rem;
      }
      #cover .cover-subtitle {
        font-size: 0.8rem;
        font-weight: 300;
        letter-spacing: 0.3em;
        color: var(--text-secondary);
        text-transform: uppercase;
      }
      #cover .enter-hint {
        position: absolute;
        bottom: 3rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        color: var(--text-faint);
        animation: breathe 3s var(--ease) infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.7;
        }
      }

      /* ═══ 导航 ═══ */
      #nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem 2.5rem;
        opacity: 0;
        transform: translateY(-8px);
        transition:
          opacity 0.5s var(--ease),
          transform 0.5s var(--ease);
        pointer-events: none;
      }
      #nav.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      #nav .nav-brand {
        font-family: var(--serif);
        font-size: 1rem;
        letter-spacing: 0.1em;
        cursor: pointer;
      }
      #nav .nav-series {
        display: flex;
        gap: 1.8rem;
        align-items: center;
      }
      #nav .nav-series button {
        background: none;
        border: none;
        font-family: var(--sans);
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 0.3rem 0;
        position: relative;
        transition: color 0.3s;
      }
      #nav .nav-series button::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 1px;
        background: var(--text-primary);
        transition: width 0.3s var(--ease);
      }
      #nav .nav-series button:hover,
      #nav .nav-series button.active {
        color: var(--text-primary);
      }
      #nav .nav-series button.active::after {
        width: 100%;
      }

      .admin-icon {
        color: var(--text-faint);
        margin-left: 0.8rem;
        display: inline-flex;
        align-items: center;
        transition: color 0.3s;
        text-decoration: none;
      }
      .admin-icon:hover {
        color: var(--text-secondary);
      }

      /* ═══ 幻灯片层 ═══ */
      #slideshow {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        filter: blur(0);
        transform: scale(1);
        transition:
          opacity 0.8s var(--ease),
          filter 0.7s var(--ease),
          transform 0.7s var(--ease);
      }
      #slideshow.active {
        opacity: 1;
      }
      #slideshow.blurred {
        filter: blur(16px);
        transform: scale(1.03);
      }

      #photo-stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #photo-stage img {
        max-width: 92vw;
        max-height: 88vh;
        object-fit: contain;
        opacity: 0;
        transform: scale(1);
        transition:
          opacity var(--duration) var(--ease),
          transform var(--duration) var(--ease);
        user-select: none;
        -webkit-user-drag: none;
      }
      #photo-stage img.loaded {
        opacity: 1;
        transform: scale(1.02);
      }

      #photo-stage .placeholder {
        position: absolute;
        width: 60px;
        height: 1px;
        background: var(--text-faint);
        animation: loadPulse 1.5s var(--ease) infinite;
      }
      @keyframes loadPulse {
        0%,
        100% {
          opacity: 0.2;
          transform: scaleX(1);
        }
        50% {
          opacity: 0.5;
          transform: scaleX(1.5);
        }
      }

      /* ═══ 作品信息 + EXIF ═══ */
      #photo-info {
        position: fixed;
        bottom: 2.5rem;
        left: 2.5rem;
        z-index: 40;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.6s var(--ease) 0.2s,
          transform 0.6s var(--ease) 0.2s;
        cursor: pointer;
        max-width: 400px;
      }
      #photo-info.visible {
        opacity: 1;
        transform: translateY(0);
      }
      #photo-info .photo-title {
        font-family: var(--serif);
        font-size: 1.05rem;
        font-weight: 400;
        letter-spacing: 0.05em;
        margin-bottom: 0.3rem;
      }
      #photo-info .photo-location {
        font-size: 0.75rem;
        font-weight: 300;
        letter-spacing: 0.12em;
        color: var(--text-secondary);
      }
      #photo-info .exif-hint {
        font-size: 0.6rem;
        color: var(--text-faint);
        margin-top: 0.4rem;
        letter-spacing: 0.05em;
        transition: opacity 0.3s;
      }

      #exif-panel {
        margin-top: 0.6rem;
        padding-top: 0.6rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: grid;
        grid-template-columns: auto auto;
        gap: 0.2rem 1.2rem;
        font-size: 0.65rem;
        color: var(--text-secondary);
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition:
          max-height 0.4s var(--ease),
          opacity 0.4s var(--ease);
      }
      #exif-panel.open {
        max-height: 200px;
        opacity: 1;
      }
      #exif-panel .exif-label {
        color: var(--text-faint);
      }
      #exif-panel .exif-value {
        color: var(--text-secondary);
      }

      #photo-counter {
        position: fixed;
        bottom: 2.5rem;
        right: 2.5rem;
        z-index: 40;
        font-size: 0.7rem;
        font-weight: 300;
        letter-spacing: 0.15em;
        color: var(--text-faint);
        opacity: 0;
        transition: opacity 0.6s var(--ease) 0.3s;
      }
      #photo-counter.visible {
        opacity: 1;
      }

      /* ═══ 箭头 ═══ */
      .arrow-hint {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        z-index: 30;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.4s var(--ease);
        color: var(--text-faint);
        font-size: 1.2rem;
        user-select: none;
      }
      .arrow-hint:hover {
        opacity: 0.6;
      }
      #slideshow:hover .arrow-hint {
        opacity: 0.25;
      }
      #arrow-left {
        left: 1.5rem;
      }
      #arrow-right {
        right: 1.5rem;
      }

      /* ═══ 向下按钮 ═══ */
      #scroll-down-btn {
        position: fixed;
        bottom: 2.5rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 45;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(0);
        -webkit-backdrop-filter: blur(0);
        color: var(--text-secondary);
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          border-color 0.3s,
          background 0.3s,
          backdrop-filter 0.4s var(--ease),
          -webkit-backdrop-filter 0.4s var(--ease);
        animation: floatDown 2.5s var(--ease) infinite;
      }
      #scroll-down-btn.visible {
        display: flex;
      }
      #scroll-down-btn:hover {
        border-color: rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px) saturate(1.3);
        -webkit-backdrop-filter: blur(12px) saturate(1.3);
      }
      #scroll-down-btn svg {
        width: 18px;
        height: 18px;
      }
      @keyframes floatDown {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(5px);
        }
      }

      #no-featured-hint {
        position: fixed;
        top: calc(50% + 1.5rem);
        left: 50%;
        transform: translateX(-50%);
        z-index: 44;
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        color: var(--text-faint);
        opacity: 0;
        transition: opacity 0.5s var(--ease);
        pointer-events: none;
      }
      #no-featured-hint.visible {
        opacity: 1;
      }

      /* ═══ 系列标题过渡 ═══ */
      #series-title {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.6s var(--ease),
          visibility 0.6s;
        pointer-events: none;
      }
      #series-title.visible {
        opacity: 1;
        visibility: visible;
      }
      #series-title h2 {
        font-family: var(--serif);
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 400;
        letter-spacing: 0.3em;
      }
      #series-title .series-count {
        position: absolute;
        bottom: 3rem;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        color: var(--text-faint);
      }

      /* ═══ 卡片层 ═══ */
      #cards-layer {
        position: fixed;
        inset: 0;
        z-index: 55;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: translateY(100%);
        transition: transform 0.7s var(--ease);
      }
      #cards-layer.active {
        transform: translateY(0);
      }

      #cards-header {
        flex-shrink: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.2rem 2.5rem;
        background: rgba(10, 10, 10, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      #cards-header .cards-series-name {
        font-family: var(--serif);
        font-size: 0.95rem;
        letter-spacing: 0.1em;
      }
      #cards-header .cards-controls {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      #sort-select {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 3px;
        color: var(--text-secondary);
        font-size: 0.65rem;
        padding: 0.25rem 0.5rem;
        font-family: var(--sans);
        cursor: pointer;
      }
      #sort-select option {
        background: #1a1a1a;
        color: var(--text-primary);
      }

      #back-to-slideshow {
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-secondary);
        transition:
          border-color 0.3s,
          color 0.3s;
      }
      #back-to-slideshow:hover {
        border-color: rgba(255, 255, 255, 0.35);
        color: var(--text-primary);
      }
      #back-to-slideshow svg {
        width: 14px;
        height: 14px;
      }

      /* 横轴滑动容器 */
      #cards-container {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 3rem;
        padding: 2rem 4rem;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        cursor: grab;
        scrollbar-width: none; /* Firefox */
      }
      #cards-container::-webkit-scrollbar {
        display: none; /* Chrome / Safari */
      }
      #cards-container.grabbing {
        cursor: grabbing;
      }

      /* 堆叠卡片 */
      .stack-card {
        flex-shrink: 0;
        scroll-snap-align: center;
        border-radius: 6px;
        overflow: hidden;
        background: #141414;
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
        transform: rotate(var(--tilt, 0deg));
      }
      .stack-card:hover {
        transform: rotate(0deg) scale(1.02);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      }
      .stack-card .card-image {
        display: block;
        max-height: 68vh;
        max-width: 80vw;
        width: auto;
        height: auto;
        object-fit: contain;
      }
      .stack-card .card-info {
        padding: 0.9rem 1.2rem;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }
      .stack-card .card-title {
        font-family: var(--serif);
        font-size: 0.85rem;
        letter-spacing: 0.05em;
      }
      .stack-card .card-location {
        font-size: 0.65rem;
        color: var(--text-secondary);
        letter-spacing: 0.08em;
      }
      .stack-card .card-exif {
        font-size: 0.55rem;
        color: var(--text-faint);
        letter-spacing: 0.03em;
        white-space: nowrap;
      }

      /* 卡片模式底部导航：上一张 + 计数器 + 下一张 */
      #cards-footer {
        position: absolute;
        bottom: 2.2rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 1.4rem;
      }
      .cards-nav {
        background: none;
        border: none;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0.3rem;
        transition:
          color 0.3s,
          opacity 0.3s;
      }
      .cards-nav:not(:disabled):hover {
        color: var(--text-primary);
      }
      .cards-nav:disabled {
        opacity: 0.2;
        cursor: default;
      }
      .cards-nav svg { width: 16px; height: 16px; }
      #cards-counter {
        font-size: 0.7rem;
        font-weight: 300;
        letter-spacing: 0.15em;
        color: var(--text-faint);
        min-width: 3.6em;
        text-align: center;
        font-variant-numeric: tabular-nums;
        user-select: none;
      }

      /* ═══ 空状态 ═══ */
      #empty-msg {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        color: var(--text-faint);
        font-size: 0.85rem;
        z-index: 80;
      }
      #empty-msg a {
        color: var(--text-secondary);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      #series-empty {
        position: fixed;
        inset: 0;
        z-index: 45;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.8rem;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.6s var(--ease),
          visibility 0.6s;
      }
      #series-empty.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      #series-empty .series-empty-name {
        font-family: var(--serif);
        font-size: 1.5rem;
        letter-spacing: 0.2em;
        color: var(--text-secondary);
      }
      #series-empty .series-empty-bar {
        width: 60px;
        height: 1px;
        background: var(--text-faint);
        animation: loadPulse 1.5s var(--ease) infinite;
        margin: 0.4rem 0;
      }
      #series-empty .series-empty-hint {
        font-size: 0.8rem;
        color: var(--text-faint);
        letter-spacing: 0.1em;
      }
      #series-empty a {
        font-size: 0.7rem;
        color: var(--text-faint);
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.3s;
      }
      #series-empty a:hover {
        color: var(--text-secondary);
      }

      /* ═══ 响应式 ═══ */
      @media (max-width: 768px) {
        #nav {
          padding: 1rem 1.5rem;
        }
        #nav .nav-series {
          gap: 1rem;
        }
        #photo-info {
          bottom: 2rem;
          left: 1.5rem;
          right: 1.5rem;
        }
        #photo-counter {
          bottom: 2rem;
          right: 1.5rem;
        }
        #photo-stage img {
          max-width: 96vw;
          max-height: 82vh;
        }
        .arrow-hint {
          display: none;
        }
        #cover .enter-hint {
          bottom: 2rem;
        }
        #cards-container {
          padding: 1.5rem 2rem;
          gap: 2rem;
        }
        .stack-card .card-image {
          max-height: 55vh;
          max-width: 85vw;
        }
        #cards-header {
          padding: 1rem 1.2rem;
        }
        #cards-footer {
          bottom: 1.6rem;
        }
        #scroll-down-btn {
          bottom: 2rem;
        }
      }

      body.page-leaving {
        opacity: 0;
        transition: opacity 0.4s var(--ease);
      }
    </style>
  </head>
  <body>
    <!-- 封面 -->
    <section id="cover" role="banner">
      <img
        class="cover-image"
        id="cover-img"
        src=""
        alt=""
        aria-hidden="true"
      />
      <div class="cover-content">
        <h1 class="photographer-name">拾 光</h1>
        <p class="cover-subtitle">Photography by Shengkun</p>
      </div>
      <p class="enter-hint">点击进入 · 或按任意键</p>
    </section>

    <!-- 导航 -->
    <nav id="nav" role="navigation">
      <span class="nav-brand" data-series="featured" role="button" tabindex="0"
        >拾光</span
      >
      <div class="nav-series">
        <button data-series="featured" class="active">精选</button>
        <a
          href="/admin"
          class="admin-icon"
          title="管理后台"
          aria-label="管理后台"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </a>
      </div>
    </nav>

    <!-- 幻灯片层 -->
    <main id="slideshow" role="main" aria-live="polite">
      <div id="photo-stage">
        <div class="placeholder" aria-hidden="true"></div>
        <img id="main-photo" src="" alt="" draggable="false" />
      </div>
      <div class="arrow-hint" id="arrow-left" role="button" aria-label="上一张">
        ‹
      </div>
      <div
        class="arrow-hint"
        id="arrow-right"
        role="button"
        aria-label="下一张"
      >
        ›
      </div>
    </main>

    <!-- 作品信息 -->
    <div id="photo-info" aria-live="polite">
      <p class="photo-title"></p>
      <p class="photo-location"></p>
      <p class="exif-hint">点击展开拍摄参数</p>
      <div id="exif-panel"></div>
    </div>
    <div id="photo-counter" aria-hidden="true"></div>

    <!-- 向下按钮 -->
    <button id="scroll-down-btn" aria-label="查看全部照片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </button>
    <p id="no-featured-hint">暂无精选</p>

    <!-- 系列切换标题 -->
    <div id="series-title" aria-hidden="true">
      <h2></h2>
      <span class="series-count"></span>
    </div>

    <!-- 卡片层 -->
    <div id="cards-layer">
      <div id="cards-header">
        <span class="cards-series-name"></span>
        <div class="cards-controls">
          <select id="sort-select" aria-label="排序方式">
            <option value="order">默认顺序</option>
            <option value="date">拍摄日期</option>
            <option value="filename">文件名</option>
          </select>
          <button id="back-to-slideshow" aria-label="返回幻灯片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="cards-container"></div>
      <div id="cards-footer">
        <button class="cards-nav" id="cards-prev" aria-label="上一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span id="cards-counter" aria-hidden="true"></span>
        <button class="cards-nav" id="cards-next" aria-label="下一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>

    <!-- 空状态 -->
    <div id="empty-msg">
      <p>尚未添加作品</p>
      <a href="/admin">前往管理后台上传照片 →</a>
    </div>

    <div id="series-empty" aria-live="polite">
      <p class="series-empty-name"></p>
      <span class="series-empty-bar" aria-hidden="true"></span>
      <p class="series-empty-hint">暂无作品</p>
      <a href="/admin">前往管理后台上传 →</a>
    </div>

    <script>
      /* ═══════════════════════════════════════════
         状态
         ═══════════════════════════════════════════ */
      let currentSeries = "featured";
      let currentList = [];
      let currentIndex = 0;
      let isTransitioning = false;
      let navTimer = null;
      let entered = false;
      let exifOpen = false;
      let cardsMode = false;

      const SERIES_META = {
        featured: { name: "精选" },
      };
      let seriesList = []; // 动态系列列表（排除 uncategorized）

      /* DOM */
      const cover = document.getElementById("cover");
      const coverImg = document.getElementById("cover-img");
      const nav = document.getElementById("nav");
      const slideshow = document.getElementById("slideshow");
      const mainPhoto = document.getElementById("main-photo");
      const photoInfo = document.getElementById("photo-info");
      const photoCounter = document.getElementById("photo-counter");
      const seriesTitle = document.getElementById("series-title");
      const arrowLeft = document.getElementById("arrow-left");
      const arrowRight = document.getElementById("arrow-right");
      const emptyMsg = document.getElementById("empty-msg");
      const exifPanel = document.getElementById("exif-panel");
      const seriesEmpty = document.getElementById("series-empty");
      const stagePlaceholder = document.querySelector(
        "#photo-stage .placeholder",
      );
      const scrollDownBtn = document.getElementById("scroll-down-btn");
      const noFeaturedHint = document.getElementById("no-featured-hint");
      const cardsLayer = document.getElementById("cards-layer");
      const cardsContainer = document.getElementById("cards-container");
      const cardsSeriesName = document.querySelector(".cards-series-name");
      const sortSelect = document.getElementById("sort-select");
      const backBtn = document.getElementById("back-to-slideshow");
      const cardsPrev = document.getElementById("cards-prev");
      const cardsNext = document.getElementById("cards-next");
      const cardsCounter = document.getElementById("cards-counter");

      /* ═══════════════════════════════════════════
         工具
         ═══════════════════════════════════════════ */
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function getSrc(photo) {
        return "/assets/" + photo.filename;
      }

      /* ═══════════════════════════════════════════
         动态加载系列
         ═══════════════════════════════════════════ */
      async function loadSeries() {
        try {
          const res = await fetch("/api/series");
          const list = await res.json();
          seriesList = list.filter((s) => s.id !== "uncategorized");
          seriesList.forEach((s) => {
            SERIES_META[s.id] = { name: s.name };
          });
          renderNavButtons();
        } catch (e) {}
      }

      function renderNavButtons() {
        const navSeries = document.querySelector(".nav-series");
        const adminIcon = navSeries.querySelector(".admin-icon");
        // 移除旧的动态按钮
        navSeries.querySelectorAll("button[data-series]:not([data-series='featured'])").forEach((b) => b.remove());
        // 在 admin icon 之前插入
        seriesList.forEach((s) => {
          const btn = document.createElement("button");
          btn.dataset.series = s.id;
          btn.textContent = s.name;
          navSeries.insertBefore(btn, adminIcon);
        });
      }

      /* ═══════════════════════════════════════════
         初始化
         ═══════════════════════════════════════════ */
      async function init() {
        await loadSeries();

        let photos = [];
        try {
          const res = await fetch("/api/photos?featured=true");
          photos = await res.json();
        } catch (e) {}

        if (photos.length === 0) {
          try {
            const res = await fetch("/api/photos");
            photos = await res.json();
            currentSeries = "all";
          } catch (e) {}
        }

        if (photos.length === 0) {
          cover.classList.add("hidden");
          emptyMsg.style.display = "flex";
          return;
        }

        currentList = shuffle([...photos]);
        const coverPhoto = photos[Math.floor(Math.random() * photos.length)];
        coverImg.src = getSrc(coverPhoto);
      }

      init();

      /* ═══════════════════════════════════════════
         进入 / 退出画廊
         ═══════════════════════════════════════════ */
      function enterGallery() {
        if (entered || currentList.length === 0) return;
        entered = true;
        cover.classList.add("hidden");
        slideshow.classList.add("active");
        showPhoto(0);
        showNav();
        scheduleNavHide();
      }

      function exitToCover() {
        if (!entered) return;
        if (cardsMode) exitCardsMode();
        entered = false;
        clearTimeout(navTimer);
        hideNav();
        slideshow.classList.remove("active");
        photoInfo.classList.remove("visible");
        photoCounter.classList.remove("visible");
        scrollDownBtn.classList.remove("visible");
        noFeaturedHint.classList.remove("visible");
        closeExif();
        document.body.style.cursor = "default";
        cover.classList.remove("hidden");
      }

      cover.addEventListener("click", enterGallery);
      document.addEventListener("keydown", (e) => {
        if (!entered && e.key !== "F5" && e.key !== "F12") enterGallery();
      });

      /* ═══════════════════════════════════════════
         幻灯片
         ═══════════════════════════════════════════ */
      function showPhoto(index) {
        if (isTransitioning || currentList.length === 0) return;
        isTransitioning = true;

        currentIndex =
          ((index % currentList.length) + currentList.length) %
          currentList.length;
        const photo = currentList[currentIndex];

        mainPhoto.classList.remove("loaded");
        photoInfo.classList.remove("visible");
        photoCounter.classList.remove("visible");
        closeExif();

        const img = new Image();
        img.onload = () => {
          mainPhoto.src = getSrc(photo);
          mainPhoto.alt =
            photo.title + (photo.location ? "，" + photo.location : "");
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              mainPhoto.classList.add("loaded");
              updateInfo(photo);
              isTransitioning = false;
            });
          });
          preloadAdjacent();
        };
        img.onerror = () => {
          mainPhoto.src = getSrc(photo);
          mainPhoto.classList.add("loaded");
          updateInfo(photo);
          isTransitioning = false;
        };
        img.src = getSrc(photo);
      }

      function updateInfo(photo) {
        photoInfo.querySelector(".photo-title").textContent = photo.title;
        photoInfo.querySelector(".photo-location").textContent =
          photo.location || "";

        const exif = photo.exif || {};
        const rows = [];
        if (exif.camera) rows.push(["相机", exif.camera]);
        if (exif.lens) rows.push(["镜头", exif.lens]);
        if (exif.focal_length) rows.push(["焦距", exif.focal_length]);
        if (exif.aperture) rows.push(["光圈", exif.aperture]);
        if (exif.shutter_speed) rows.push(["快门", exif.shutter_speed]);
        if (exif.iso) rows.push(["感光度", exif.iso]);
        if (photo.date_taken) rows.push(["拍摄时间", photo.date_taken]);

        const hint = photoInfo.querySelector(".exif-hint");
        if (rows.length > 0) {
          hint.style.display = "block";
          exifPanel.innerHTML = rows
            .map(
              ([l, v]) =>
                `<span class="exif-label">${l}</span><span class="exif-value">${v}</span>`,
            )
            .join("");
        } else {
          hint.style.display = "none";
          exifPanel.innerHTML = "";
        }

        photoInfo.classList.add("visible");
        photoCounter.textContent =
          currentIndex + 1 + " / " + currentList.length;
        photoCounter.classList.add("visible");
      }

      function preloadAdjacent() {
        if (currentList.length <= 1) return;
        const prevIdx =
          (currentIndex - 1 + currentList.length) % currentList.length;
        const nextIdx = (currentIndex + 1) % currentList.length;
        new Image().src = getSrc(currentList[prevIdx]);
        new Image().src = getSrc(currentList[nextIdx]);
      }

      function goNext() {
        showPhoto(currentIndex + 1);
      }
      function goPrev() {
        showPhoto(currentIndex - 1);
      }

      /* ═══════════════════════════════════════════
         EXIF
         ═══════════════════════════════════════════ */
      photoInfo.addEventListener("click", () => {
        if (exifPanel.innerHTML === "") return;
        exifOpen = !exifOpen;
        exifPanel.classList.toggle("open", exifOpen);
        photoInfo.querySelector(".exif-hint").textContent = exifOpen
          ? "点击收起"
          : "点击展开拍摄参数";
      });

      function closeExif() {
        exifOpen = false;
        exifPanel.classList.remove("open");
        const hint = photoInfo.querySelector(".exif-hint");
        if (hint) hint.textContent = "点击展开拍摄参数";
      }

      /* ═══════════════════════════════════════════
         卡片模式
         ═══════════════════════════════════════════ */
      async function enterCardsMode(sort) {
        cardsMode = true;
        const sortParam = sort && sort !== "order" ? "&sort=" + sort : "";
        let photos = [];
        try {
          const res = await fetch(
            `/api/photos?series=${currentSeries}${sortParam}`,
          );
          photos = await res.json();
        } catch (e) {}

        cardsSeriesName.textContent = SERIES_META[currentSeries]?.name || "";
        renderCards(photos);
        requestAnimationFrame(updateCardsCounter);

        photoInfo.classList.remove("visible");
        photoCounter.classList.remove("visible");
        scrollDownBtn.classList.remove("visible");
        noFeaturedHint.classList.remove("visible");
        closeExif();
        slideshow.classList.add("blurred");
        cardsLayer.classList.add("active");
      }

      function exitCardsMode() {
        cardsMode = false;
        cardsLayer.classList.remove("active");
        slideshow.classList.remove("blurred");
        cardsContainer.scrollLeft = 0;
        if (currentList.length > 0) {
          photoInfo.classList.add("visible");
          photoCounter.classList.add("visible");
        }
        if (currentSeries !== "featured") {
          scrollDownBtn.classList.add("visible");
          if (currentList.length === 0) {
            noFeaturedHint.classList.add("visible");
          }
        }
      }

      function renderCards(photos) {
        cardsContainer.innerHTML = "";
        photos.forEach((photo, i) => {
          const exif = photo.exif || {};
          const exifParts = [
            exif.focal_length,
            exif.aperture,
            exif.shutter_speed,
            exif.iso,
          ].filter(Boolean);

          const tilt = (Math.random() * 5 - 2.5).toFixed(1);
          const card = document.createElement("article");
          card.className = "stack-card";
          card.style.setProperty("--tilt", tilt + "deg");
          card.innerHTML = `
            <img class="card-image" src="/assets/${photo.filename}" alt="${photo.title}" loading="lazy">
            <div class="card-info">
              <div>
                <span class="card-title">${photo.title}</span>
                ${photo.location ? `<span class="card-location"> · ${photo.location}</span>` : ""}
              </div>
              <span class="card-exif">${exifParts.join("  ")}</span>
            </div>
          `;
          cardsContainer.appendChild(card);
        });
      }

      scrollDownBtn.addEventListener("click", () => {
        if (!cardsMode) enterCardsMode("order");
      });

      backBtn.addEventListener("click", exitCardsMode);

      sortSelect.addEventListener("change", () => {
        if (cardsMode) enterCardsMode(sortSelect.value);
      });

      /* ── 卡片模式：鼠标拖拽横向滚动 ── */
      let isDragging = false;
      let dragStartX = 0;
      let dragScrollLeft = 0;

      cardsContainer.addEventListener("mousedown", (e) => {
        isDragging = true;
        dragStartX = e.pageX;
        dragScrollLeft = cardsContainer.scrollLeft;
        cardsContainer.classList.add("grabbing");
        /* 关闭 smooth + snap，保证 1:1 跟手 */
        cardsContainer.style.scrollBehavior = "auto";
        cardsContainer.style.scrollSnapType = "none";
        e.preventDefault();
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        cardsContainer.scrollLeft = dragScrollLeft - (e.pageX - dragStartX);
      });

      document.addEventListener("mouseup", () => {
        if (!isDragging) return;
        isDragging = false;
        cardsContainer.classList.remove("grabbing");
        /* 恢复 smooth + snap，自动吸附到最近卡片 */
        cardsContainer.style.scrollBehavior = "smooth";
        cardsContainer.style.scrollSnapType = "x mandatory";
      });

      /* ── 卡片模式：底部按钮 + 计数器 ── */
      function scrollToCard(index) {
        const cards = cardsContainer.querySelectorAll(".stack-card");
        if (index < 0 || index >= cards.length) return;
        const card = cards[index];
        const target =
          card.offsetLeft + card.offsetWidth / 2 - cardsContainer.offsetWidth / 2;
        cardsContainer.scrollTo({ left: target, behavior: "smooth" });
      }

      function getCurrentCardIndex() {
        const cards = cardsContainer.querySelectorAll(".stack-card");
        if (cards.length === 0) return 0;
        const center =
          cardsContainer.scrollLeft + cardsContainer.offsetWidth / 2;
        let closest = 0,
          minDist = Infinity;
        cards.forEach((card, i) => {
          const d = Math.abs(card.offsetLeft + card.offsetWidth / 2 - center);
          if (d < minDist) {
            minDist = d;
            closest = i;
          }
        });
        return closest;
      }

      function updateCardsCounter() {
        const cards = cardsContainer.querySelectorAll(".stack-card");
        const total = cards.length;
        if (total === 0) {
          cardsCounter.textContent = "0 / 0";
          cardsPrev.disabled = true;
          cardsNext.disabled = true;
          return;
        }
        const idx = getCurrentCardIndex();
        cardsCounter.textContent = idx + 1 + " / " + total;
        cardsPrev.disabled = idx <= 0;
        cardsNext.disabled = idx >= total - 1;
      }

      cardsPrev.addEventListener("click", () => {
        scrollToCard(getCurrentCardIndex() - 1);
      });
      cardsNext.addEventListener("click", () => {
        scrollToCard(getCurrentCardIndex() + 1);
      });

      cardsContainer.addEventListener("scroll", updateCardsCounter);

      /* ═══════════════════════════════════════════
         系列切换
         ═══════════════════════════════════════════ */
      async function switchSeries(series) {
        if (series === currentSeries) return;
        if (cardsMode) exitCardsMode();

        currentSeries = series;
        sortSelect.value = "order";

        // 立即隐藏当前照片，防止切换时闪现旧系列内容
        mainPhoto.classList.remove("loaded");
        photoInfo.classList.remove("visible");
        photoCounter.classList.remove("visible");
        scrollDownBtn.classList.remove("visible");
        noFeaturedHint.classList.remove("visible");
        closeExif();

        nav.querySelectorAll(".nav-series button").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.series === series);
        });

        const meta = SERIES_META[series] || { name: "全部" };
        seriesTitle.querySelector("h2").textContent = meta.name;

        let photos = [];
        if (series === "featured") {
          try {
            const res = await fetch("/api/photos?featured=true");
            photos = await res.json();
          } catch (e) {}
          photos = shuffle(photos);
          seriesTitle.querySelector(".series-count").textContent =
            photos.length > 0 ? photos.length + " 幅作品" : "";
        } else {
          try {
            const res = await fetch(
              `/api/photos?series=${series}&featured=true`,
            );
            photos = await res.json();
          } catch (e) {}
          seriesTitle.querySelector(".series-count").textContent =
            photos.length > 0 ? photos.length + " 幅精选" : "";
        }

        seriesTitle.classList.add("visible");

        setTimeout(() => {
          seriesTitle.classList.remove("visible");
          noFeaturedHint.classList.remove("visible");
          currentIndex = 0;
          isTransitioning = false;

          if (photos.length === 0 && series !== "featured") {
            checkSeriesEmpty(series);
          } else if (photos.length === 0) {
            currentList = [];
            mainPhoto.classList.remove("loaded");
            photoInfo.classList.remove("visible");
            photoCounter.classList.remove("visible");
            scrollDownBtn.classList.remove("visible");
            closeExif();
          } else {
            seriesEmpty.classList.remove("visible");
            stagePlaceholder.style.display = "";
            currentList = photos;
            showPhoto(0);
            scrollDownBtn.classList.toggle("visible", series !== "featured");
          }
        }, 1200);
      }

      async function checkSeriesEmpty(series) {
        let allPhotos = [];
        try {
          const res = await fetch(`/api/photos?series=${series}`);
          allPhotos = await res.json();
        } catch (e) {}

        if (allPhotos.length === 0) {
          currentList = [];
          mainPhoto.classList.remove("loaded");
          photoInfo.classList.remove("visible");
          photoCounter.classList.remove("visible");
          scrollDownBtn.classList.remove("visible");
          closeExif();
          stagePlaceholder.style.display = "none";
          seriesEmpty.querySelector(".series-empty-name").textContent =
            SERIES_META[series]?.name || "";
          seriesEmpty.classList.add("visible");
        } else {
          seriesEmpty.classList.remove("visible");
          currentList = [];
          mainPhoto.classList.remove("loaded");
          photoInfo.classList.remove("visible");
          photoCounter.classList.remove("visible");
          closeExif();
          enterCardsMode("order");
        }
      }

      nav.addEventListener("click", (e) => {
        const el = e.target.closest("[data-series]");
        if (el) switchSeries(el.dataset.series);
      });

      /* ═══════════════════════════════════════════
         导航显隐
         ═══════════════════════════════════════════ */
      function showNav() {
        nav.classList.add("visible");
        document.body.style.cursor = "default";
      }
      function hideNav() {
        nav.classList.remove("visible");
      }
      function scheduleNavHide() {
        clearTimeout(navTimer);
        navTimer = setTimeout(() => {
          if (!cardsMode) {
            hideNav();
            document.body.style.cursor = "none";
          }
        }, 3000);
      }
      document.addEventListener("mousemove", () => {
        if (!entered) return;
        showNav();
        document.body.style.cursor = "default";
        scheduleNavHide();
      });

      /* ═══════════════════════════════════════════
         键盘 / 箭头 / 触屏 / 滚轮
         ═══════════════════════════════════════════ */
      document.addEventListener("keydown", (e) => {
        if (!entered) return;
        if (cardsMode) {
          if (e.key === "Escape") exitCardsMode();
          return;
        }
        switch (e.key) {
          case "ArrowRight":
          case "ArrowDown":
            goNext();
            break;
          case "ArrowLeft":
          case "ArrowUp":
            goPrev();
            break;
          case "Escape":
            exitToCover();
            break;
          default:
            if (e.key >= "1" && e.key <= "9") {
              const idx = parseInt(e.key) - 1;
              if (idx < seriesList.length) switchSeries(seriesList[idx].id);
            }
        }
      });

      arrowLeft.addEventListener("click", goPrev);
      arrowRight.addEventListener("click", goNext);

      let touchStartX = 0,
        touchStartY = 0;
      document.addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        },
        { passive: true },
      );
      document.addEventListener(
        "touchend",
        (e) => {
          if (!entered || cardsMode) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy))
            dx < 0 ? goNext() : goPrev();
        },
        { passive: true },
      );

      let wheelLock = false;
      document.addEventListener(
        "wheel",
        (e) => {
          if (!entered || wheelLock) return;

          if (cardsMode) {
            /* 卡片模式：一个 notch 切一张卡片 */
            const cards = cardsContainer.querySelectorAll(".stack-card");
            if (cards.length === 0) return;
            wheelLock = true;
            const dir = e.deltaY > 0 || e.deltaX > 0 ? 1 : -1;
            scrollToCard(getCurrentCardIndex() + dir);
            setTimeout(() => { wheelLock = false; }, 600);
            return;
          }

          /* 幻灯片模式 */
          wheelLock = true;
          e.deltaY > 0 || e.deltaX > 0 ? goNext() : goPrev();
          setTimeout(() => { wheelLock = false; }, 900);
        },
        { passive: true },
      );

      /* 管理后台链接 */
      document.querySelector(".admin-icon").addEventListener("click", (e) => {
        e.preventDefault();
        document.body.classList.add("page-leaving");
        setTimeout(() => {
          window.location.href = "/admin";
        }, 400);
      });
    </script>
  </body>
</html>
