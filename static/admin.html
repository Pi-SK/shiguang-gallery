<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光 · 管理</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #111;
  --surface: #1a1a1a;
  --surface-hover: #222;
  --border: #2a2a2a;
  --border-active: #444;
  --text: rgba(255,255,255,0.85);
  --text-dim: rgba(255,255,255,0.5);
  --text-faint: rgba(255,255,255,0.3);
  --accent: #a08c6a;
  --accent-dim: rgba(160,140,106,0.15);
  --danger: #c0564f;
  --success: #5fa07a;
  --radius: 6px;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  --sans: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif;
}

html { font-size: 14px; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem;
  line-height: 1.6;
}

/* 全局滚动条 */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.22); }
html { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.12) transparent; }

/* ─── 头部 ─── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 1.2rem; font-weight: 400; letter-spacing: 0.1em; }
header .links a { color: var(--text-dim); text-decoration: none; font-size: 0.75rem; margin-left: 1rem; }
header .links a:hover { color: var(--text); }

/* ─── 圆形上传按钮 ─── */
.fab {
  position: fixed;
  top: 6.5rem;
  right: 2rem;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #111;
  font-size: 1.4rem;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s, transform 0.15s;
  z-index: 50;
}
.fab:hover { opacity: 0.85; transform: scale(1.08); }
.fab:active { transform: scale(0.95); }

/* ─── 去重按钮（次要） ─── */
.fab-secondary {
  position: fixed;
  top: 6.5rem;
  right: 5.9rem;
  height: 44px;
  padding: 0 1rem;
  border-radius: 22px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-size: 0.7rem;
  font-family: var(--sans);
  letter-spacing: 0.05em;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: border-color 0.3s, color 0.3s;
  z-index: 50;
  text-decoration: none;
}
.fab-secondary:hover { border-color: var(--border-active); color: var(--text); }
.fab-secondary svg { width: 15px; height: 15px; transition: transform 0.3s var(--ease); }
.fab-secondary:hover svg { transform: scale(1.12); color: var(--accent); }

/* ─── 上传弹窗 ─── */
#upload-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s, visibility 0.25s;
}
#upload-overlay.show { opacity: 1; visibility: visible; }

#upload-panel {
  background: rgba(30, 30, 30, 0.65);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 2rem 2.2rem;
  width: 92%;
  max-width: 860px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: scale(0.95);
  transition: transform 0.25s var(--ease);
}
#upload-overlay.show #upload-panel { transform: scale(1); }

/* 自定义滚动条 */
.preview-grid::-webkit-scrollbar { width: 5px; }
.preview-grid::-webkit-scrollbar-track { background: transparent; }
.preview-grid::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
.preview-grid::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

#drop-zone {
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  padding: 2rem 2rem;
  text-align: center;
  color: var(--text-dim);
  transition: border-color 0.3s, background 0.3s;
  cursor: pointer;
}
#drop-zone.dragover { border-color: var(--accent); background: var(--accent-dim); }
#drop-zone .sub { font-size: 0.75rem; color: var(--text-faint); margin-top: 0.5rem; }

/* ─── 上传状态 ─── */
.preview-grid:empty { display: none; }
.preview-grid:not(:empty) { margin-top: 1rem; }

/* 上传预览卡片（瀑布流） */
.preview-grid {
  columns: 2;
  column-gap: 1rem;
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  padding-bottom: 1rem;
  scrollbar-width: thin;
}

.preview-card {
  break-inside: avoid;
  margin-bottom: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.preview-card .thumb-wrap {
  width: 100%;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.03);
}
.preview-card .thumb-wrap img {
  width: 100%;
  height: auto;
  display: block;
}

.preview-card .card-body { padding: 0.75rem 1rem; }

.preview-card .exif-line {
  font-size: 0.65rem;
  color: var(--text-faint);
  margin-bottom: 0.5rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.preview-card input,
.preview-card select {
  font-family: var(--sans);
  font-size: 0.8rem;
  padding: 0.35rem 0.5rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  width: 100%;
  margin-bottom: 0.4rem;
}
.preview-card input:focus, .preview-card select:focus { outline: none; border-color: var(--accent); }

.preview-card .card-footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.4rem;
}

.preview-card .featured-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  color: var(--text-faint);
  cursor: pointer;
  user-select: none;
  transition: color 0.2s;
}
.preview-card .featured-toggle:hover { color: var(--text-dim); }
.preview-card .featured-toggle svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linejoin: round;
  transition: fill 0.2s var(--ease), transform 0.2s var(--ease), color 0.2s;
}
.preview-card .featured-toggle:hover svg { transform: scale(1.12); color: var(--accent); }
.preview-card .featured-toggle.on { color: var(--accent); }
.preview-card .featured-toggle.on svg { fill: currentColor; filter: drop-shadow(0 0 5px rgba(160, 140, 106, 0.4)); }

/* EXIF 折叠编辑区 */
.exif-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.72rem;
  color: var(--text-faint);
  cursor: pointer;
  user-select: none;
  transition: color 0.2s;
}
.exif-toggle:hover { color: var(--text-dim); }
.exif-toggle .exif-toggle-arrow {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.25s var(--ease);
}
.exif-toggle.open .exif-toggle-arrow { transform: rotate(90deg); }

.exif-edit {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s;
  margin-top: 0;
}
.exif-edit.open {
  max-height: 300px;
  opacity: 1;
  margin-top: 0.5rem;
}
.exif-edit .exif-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.35rem;
}
.exif-edit .exif-field {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.exif-edit .exif-field label {
  font-size: 0.6rem;
  color: var(--text-faint);
}
.exif-edit .exif-field input {
  font-size: 0.7rem;
  padding: 0.25rem 0.4rem;
  margin-bottom: 0;
}

/* 确认按钮区（固定在弹窗底部居中） */
.confirm-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin: 0 -2.2rem -2rem;
  padding: 0.9rem 2.2rem;
  background: rgba(22, 22, 22, 0.65);
  backdrop-filter: blur(20px) saturate(1.3);
  -webkit-backdrop-filter: blur(20px) saturate(1.3);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 0 0 12px 12px;
  flex-shrink: 0;
}
.confirm-bar .bar-info { font-size: 0.72rem; color: var(--text-dim); }

/* 预览卡片删除按钮 */
.preview-card { position: relative; }
.preview-card .preview-remove {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  background: rgba(0, 0, 0, 0.6);
  color: rgba(255, 255, 255, 0.85);
  font-size: 0.85rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: scale(0.8);
  transition: opacity 0.2s, transform 0.2s, background 0.2s;
  z-index: 2;
}
.preview-card:hover .preview-remove { opacity: 1; transform: scale(1); }
.preview-card .preview-remove:hover { background: var(--danger); color: #fff; }

/* ─── 管理视图 ─── */
.series-tabs {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}
.series-tabs button {
  background: none;
  border: none;
  font-family: var(--sans);
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0.3rem 0;
  border-bottom: 1.5px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.series-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.series-tabs .series-add {
  font-size: 1rem;
  color: var(--text-faint);
  border-bottom: none !important;
  padding: 0.3rem 0.5rem;
}
.series-tabs .series-add:hover { color: var(--accent); }
.series-tabs .tab-del {
  display: none;
  margin-left: 0.3rem;
  font-size: 0.7rem;
  color: var(--text-faint);
  transition: color 0.2s;
}
.series-tabs button:hover .tab-del { display: inline; }
.series-tabs .tab-del:hover { color: var(--danger); }
.series-tabs .tab-rename {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 0.8rem;
  padding: 0.2rem 0.5rem;
  width: 5em;
  font-family: var(--sans);
}
.series-tabs .tab-rename:focus { outline: none; border-color: var(--accent); }

.section-label {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin: 1.5rem 0 0.75rem;
}

.photo-row {
  display: grid;
  grid-template-columns: 90px 1fr auto auto;
  grid-template-rows: auto auto;
  align-items: center;
  column-gap: 0.75rem;
  row-gap: 0;
  padding: 0.6rem 0.75rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color 0.2s, opacity 0.2s;
  overflow: hidden;
}
.photo-row.featured {
  grid-template-columns: 20px 90px 1fr auto auto;
}
.photo-row:hover { border-color: var(--border-active); }
.photo-row.dragging { opacity: 0.4; }
.photo-row.drag-over { border-color: var(--accent); }
.photo-row[draggable="true"] { cursor: grab; }

.photo-row .order-num { display: none; }
.photo-row.featured .order-num {
  display: block;
  grid-column: 1;
  grid-row: 1;
  align-self: center;
  font-size: 0.6rem;
  color: var(--text-faint);
  text-align: center;
  user-select: none;
}
.photo-row .thumb {
  grid-column: 1;
  grid-row: 1;
  width: 90px;
  height: 60px;
  object-fit: contain;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.03);
  align-self: center;
}
.photo-row.featured .thumb { grid-column: 2; }
.photo-row .inputs-wrap {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  align-self: center;
}
.photo-row.featured .inputs-wrap { grid-column: 3; }
.photo-row .exif-summary {
  grid-column: 3;
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.6rem;
  color: var(--text-faint);
  cursor: pointer;
  user-select: none;
  padding: 0.2rem 1rem;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  line-height: 1.6;
  align-self: center;
  min-width: 10em;
}
.photo-row .exif-arrow {
  display: flex;
  align-items: center;
  color: var(--text-dim);
  transition: transform 0.25s var(--ease), color 0.2s;
  flex-shrink: 0;
}
.photo-row .exif-arrow svg { width: 13px; height: 13px; }
.photo-row .exif-summary:hover .exif-arrow { color: var(--accent); }
.photo-row .exif-summary.open .exif-arrow {
  transform: rotate(90deg);
}
.photo-row.featured .exif-summary { grid-column: 4; }
.photo-row .actions-wrap {
  grid-column: 4;
  grid-row: 1;
  display: flex;
  align-items: center;
  gap: 0.2rem;
  align-self: center;
}
.photo-row.featured .actions-wrap { grid-column: 5; }
.photo-row input {
  font-family: var(--sans);
  font-size: 0.75rem;
  padding: 0.3rem 0.5rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  width: 100%;
}
.photo-row input:focus { outline: none; border-color: var(--accent); }

/* 操作图标按钮（精选 / 移动 / 删除 统一样式） */
.photo-row .star,
.photo-row .move-series,
.photo-row .del {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
}
.photo-row .star:hover,
.photo-row .move-series:hover,
.photo-row .del:hover { background: rgba(255, 255, 255, 0.06); }
.photo-row .star:active,
.photo-row .move-series:active,
.photo-row .del:active { transform: scale(0.88); }

/* 精选星标 */
.photo-row .star svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linejoin: round;
  transition: fill 0.2s var(--ease), transform 0.2s var(--ease);
}
.photo-row .star:hover { color: var(--accent); }
.photo-row .star:hover svg { transform: scale(1.12); }
.photo-row .star.on { color: var(--accent); filter: drop-shadow(0 0 6px rgba(160, 140, 106, 0.45)); }
.photo-row .star.on svg { fill: currentColor; }

/* 删除 */
.photo-row .del:hover { color: var(--danger); background: rgba(192, 86, 79, 0.12); }
.photo-row .del svg { width: 15px; height: 15px; }

/* 行内 EXIF 展开面板（覆盖全局 .exif-edit 样式） */
.photo-row .exif-edit {
  grid-column: 1 / -1;
  grid-row: 2;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  padding: 0 0.75rem;
  border-top: 0 solid rgba(255,255,255,0.06);
  transition: max-height 0.35s var(--ease), opacity 0.3s var(--ease),
              padding 0.3s var(--ease), border-top-width 0.2s;
}
.photo-row .exif-edit.open {
  max-height: 300px;
  opacity: 1;
  padding: 0.7rem 0.75rem 0.8rem;
  border-top-width: 1px;
  margin-top: 0.5rem;
}
.photo-row .exif-edit .exif-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem 1rem;
}
.photo-row .exif-edit .exif-field label {
  font-size: 0.6rem;
  color: var(--text-faint);
  letter-spacing: 0.05em;
}
.photo-row .exif-edit .exif-field input {
  font-size: 0.7rem;
  padding: 0.3rem 0.5rem;
  margin-bottom: 0;
}

/* ─── 通用按钮 ─── */
button.btn {
  font-family: var(--sans);
  font-size: 0.8rem;
  padding: 0.5rem 1.2rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
button.btn:hover { border-color: var(--border-active); background: var(--surface-hover); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 500; }
button.btn.primary:hover { opacity: 0.9; }
button.btn.danger { border-color: var(--danger); color: var(--danger); }
button.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ─── Toast ─── */
#toast {
  position: fixed;
  bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.6rem 1.5rem;
  font-size: 0.8rem;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  z-index: 100;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── 自定义确认弹窗 ─── */
#modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
}
#modal-overlay.show { opacity: 1; visibility: visible; }

#modal-box {
  background: rgba(30, 30, 30, 0.65);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius);
  padding: 1.8rem 2rem;
  max-width: 340px;
  width: 90%;
  text-align: center;
  transform: scale(0.95);
  transition: transform 0.2s var(--ease);
}
#modal-overlay.show #modal-box { transform: scale(1); }

#modal-box .modal-msg {
  font-size: 0.85rem;
  color: var(--text);
  margin-bottom: 1.5rem;
  line-height: 1.6;
}

#modal-box .modal-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
}

#modal-box .modal-actions button {
  font-family: var(--sans);
  font-size: 0.8rem;
  padding: 0.45rem 1.4rem;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-dim);
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
#modal-box .modal-actions button:hover { border-color: var(--border-active); color: var(--text); }

#modal-box .modal-actions .modal-confirm {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}
#modal-box .modal-actions .modal-confirm:hover { opacity: 0.85; }

#modal-box .modal-input {
  width: 100%;
  margin-bottom: 1.2rem;
  padding: 0.5rem 0.75rem;
  font-family: var(--sans);
  font-size: 0.85rem;
  color: var(--text);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: var(--radius);
  outline: none;
  transition: border-color 0.2s;
}
#modal-box .modal-input:focus { border-color: rgba(255, 255, 255, 0.35); }

/* ─── 空状态 ─── */
.empty { text-align: center; padding: 3rem; color: var(--text-faint); font-size: 0.85rem; }

/* ─── 瀑布流（管理列表） ─── */
#featured-list, #all-list {
  columns: 2;
  column-gap: 0.5rem;
}
#featured-list .photo-row,
#all-list .photo-row {
  break-inside: avoid;
  margin-bottom: 0.5rem;
}

/* 精选空状态（跨列居中） */
.featured-empty {
  text-align: center;
  padding: 1.2rem;
  color: var(--text-faint);
  font-size: 0.8rem;
}

/* ─── 移动主题 ─── */
.photo-row .move-series:hover { color: var(--accent); }
.photo-row .move-series svg { width: 15px; height: 15px; }

.move-dropdown {
  position: fixed;
  background: rgba(30, 30, 30, 0.92);
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--radius);
  padding: 0.3rem 0;
  min-width: 120px;
  z-index: 300;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5);
}
.move-dropdown button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.4rem 0.9rem;
  font-family: var(--sans);
  font-size: 0.75rem;
  color: var(--text-dim);
  background: none;
  border: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.move-dropdown button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
.move-dropdown button.current { color: var(--accent); cursor: default; }

/* ─── 响应式 ─── */
@media (max-width: 700px) {
  body { padding: 1rem; }
  .photo-row { grid-template-columns: 72px 1fr auto; }
  .photo-row.featured { grid-template-columns: 18px 72px 1fr auto; }
  .photo-row .thumb { width: 72px; height: 48px; }
  .photo-row .exif-summary { display: none; }
  .photo-row .actions-wrap { grid-column: 3; }
  .photo-row.featured .actions-wrap { grid-column: 4; }
  .preview-grid { columns: 1; }
}
</style>
</head>
<body>

<header>
  <h1>拾光 · 作品管理</h1>
  <div class="links"><a href="/">查看画廊 →</a></div>
</header>

<!-- 圆形上传按钮 -->
<button id="btn-upload-fab" class="fab" title="上传照片">+</button>
<a href="/admin/dedup" class="fab-secondary" title="照片去重">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg>
  去重
</a>

<!-- 上传弹窗 -->
<div id="upload-overlay">
  <div id="upload-panel">
    <div id="drop-zone">
      <p>将照片拖入此处，或点击选择文件</p>
      <p class="sub">上传后自动解析 EXIF 信息</p>
    </div>
    <div class="preview-grid" id="preview-grid"></div>
    <div class="confirm-bar" id="confirm-bar" style="display:none;">
      <span class="bar-info" id="bar-info"></span>
      <button class="btn primary" id="btn-confirm">确认上传</button>
      <button class="btn danger" id="btn-cancel-upload">取消全部</button>
    </div>
  </div>
</div>

<!-- ═══ 管理视图 ═══ -->
<div id="manage-view">
  <div class="series-tabs" id="series-tabs">
    <!-- 由 JS 动态渲染 -->
    <button class="series-add" id="btn-add-series" title="新增主题">+</button>
  </div>

  <div class="section-label">★ 精选（拖拽排序）</div>
  <div class="featured-empty" id="featured-empty" style="display:none;">暂无精选照片，在下方点击 ★ 标记</div>
  <div id="featured-list"></div>

  <div class="section-label">全部作品</div>
  <div id="all-list"></div>
  <div class="empty" id="manage-empty" style="display:none;">该系列暂无照片</div>
</div>

<div id="toast"></div>

<!-- 自定义确认弹窗 -->
<div id="modal-overlay">
  <div id="modal-box">
    <p class="modal-msg"></p>
    <input class="modal-input" type="text" style="display:none;" />
    <div class="modal-actions">
      <button class="modal-cancel">取消</button>
      <button class="modal-confirm">删除</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   状态
   ═══════════════════════════════════════════ */
let pendingUploads = [];  // 上传预览中的照片
let allPhotos = [];       // 已入库的全部照片
let currentManageSeries = 'shanchuan';


/* 缩略图 URL（带 fallback） */
function getThumb(photo) {
  return photo.thumb ? '/assets/thumbs/' + photo.thumb : '/assets/' + photo.filename;
}

let SERIES = [];  // 从 API 动态加载

/* DOM */
const fabUpload = document.getElementById('btn-upload-fab');
const uploadOverlay = document.getElementById('upload-overlay');
const uploadPanel = document.getElementById('upload-panel');
const dropZone = document.getElementById('drop-zone');
const previewGrid = document.getElementById('preview-grid');
const confirmBar = document.getElementById('confirm-bar');
const featuredList = document.getElementById('featured-list');
const allList = document.getElementById('all-list');
const manageEmpty = document.getElementById('manage-empty');

/* ═══════════════════════════════════════════
   上传弹窗开关
   ═══════════════════════════════════════════ */
function openUploadModal() { uploadOverlay.classList.add('show'); }
function closeUploadModal() { uploadOverlay.classList.remove('show'); }

fabUpload.addEventListener('click', openUploadModal);

/* 点击遮罩关闭（排除从 panel 内部拖出的 mouseup） */
let panelMouseDown = false;
uploadPanel.addEventListener('mousedown', () => { panelMouseDown = true; });
uploadOverlay.addEventListener('click', (e) => {
  if (e.target === uploadOverlay && !panelMouseDown) closeUploadModal();
  panelMouseDown = false;
});

/* ═══════════════════════════════════════════
   拖拽 / 点击上传
   ═══════════════════════════════════════════ */
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files).filter(f => /\.(jpe?g|png|webp|gif|tiff?)$/i.test(f.name));
  if (files.length) doUpload(files);
});
dropZone.addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.multiple = true; input.accept = 'image/*';
  input.onchange = () => { if (input.files.length) doUpload(Array.from(input.files)); };
  input.click();
});

/* ═══════════════════════════════════════════
   上传流程
   ═══════════════════════════════════════════ */
async function doUpload(files) {
  const formData = new FormData();
  files.forEach(f => formData.append('files', f));

  try {
    const res = await fetch('/api/photos/upload', { method: 'POST', body: formData });
    if (!res.ok) throw new Error((await res.json()).detail || '上传失败');
    const results = await res.json();
    pendingUploads = pendingUploads.concat(results);
    showToast(`已解析 ${results.length} 张`);
    renderPreviews();
  } catch (e) {
    showToast('上传失败: ' + e.message);
  }
}

function renderPreviews() {
  previewGrid.innerHTML = '';
  confirmBar.style.display = pendingUploads.length ? 'flex' : 'none';
  document.getElementById('bar-info').textContent = pendingUploads.length ? `待上传 ${pendingUploads.length} 张` : '';

  pendingUploads.forEach((photo, i) => {
    const exif = photo.exif || {};
    const exifParts = [exif.camera, exif.lens, exif.focal_length, exif.aperture, exif.shutter_speed, exif.iso, exif.date_taken].filter(Boolean);

    const card = document.createElement('div');
    card.className = 'preview-card';
    card.innerHTML = `
      <div class="thumb-wrap">
        <img src="${getThumb(photo)}" alt="">
        <button class="preview-remove" data-idx="${i}" title="移除这张">&times;</button>
      </div>
      <div class="card-body">
        <div class="exif-line" title="${escapeHtml(exifParts.join(' | '))}">${escapeHtml(exifParts.join(' · ') || '无 EXIF 信息')}</div>
        <input type="text" value="${escapeHtml(photo.title)}" placeholder="标题" data-idx="${i}" data-field="title">
        <input type="text" value="${escapeHtml(photo.location || '')}" placeholder="拍摄地点" data-idx="${i}" data-field="location">
        <select data-idx="${i}" data-field="series">
          ${SERIES.map(s => `<option value="${s.id}" ${photo.series === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
        </select>
        <div class="card-footer-row">
          <div class="featured-toggle ${photo.featured ? 'on' : ''}" data-idx="${i}">
            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            设为精选
          </div>
          <div class="exif-toggle" data-idx="${i}"><svg class="exif-toggle-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span class="exif-toggle-label">编辑 EXIF</span></div>
        </div>
        <div class="exif-edit" id="exif-edit-${i}">
          <div class="exif-grid">
            <div class="exif-field"><label>相机</label><input type="text" value="${escapeHtml(exif.camera || '')}" data-idx="${i}" data-exif="camera"></div>
            <div class="exif-field"><label>镜头</label><input type="text" value="${escapeHtml(exif.lens || '')}" data-idx="${i}" data-exif="lens"></div>
            <div class="exif-field"><label>焦距</label><input type="text" value="${escapeHtml(exif.focal_length || '')}" data-idx="${i}" data-exif="focal_length"></div>
            <div class="exif-field"><label>光圈</label><input type="text" value="${escapeHtml(exif.aperture || '')}" data-idx="${i}" data-exif="aperture"></div>
            <div class="exif-field"><label>快门</label><input type="text" value="${escapeHtml(exif.shutter_speed || '')}" data-idx="${i}" data-exif="shutter_speed"></div>
            <div class="exif-field"><label>ISO</label><input type="text" value="${escapeHtml(exif.iso || '')}" data-idx="${i}" data-exif="iso"></div>
            <div class="exif-field"><label>拍摄日期</label><input type="text" value="${escapeHtml(photo.date_taken || '')}" data-idx="${i}" data-exif="date_taken"></div>
          </div>
        </div>
      </div>
    `;
    previewGrid.appendChild(card);
  });

  // 单张移除
  previewGrid.querySelectorAll('.preview-remove').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      const photo = pendingUploads[idx];
      try { await fetch(`/api/photos/${photo.id}`, { method: 'DELETE' }); } catch (_) {}
      pendingUploads.splice(idx, 1);
      renderPreviews();
    });
  });

  // 绑定编辑
  previewGrid.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('change', () => {
      const idx = parseInt(el.dataset.idx);
      const field = el.dataset.field;
      pendingUploads[idx][field] = el.value;
    });
  });

  // 精选星标切换
  previewGrid.querySelectorAll('.featured-toggle').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      const newState = !pendingUploads[idx].featured;
      pendingUploads[idx].featured = newState;
      el.classList.toggle('on', newState);
    });
  });

  // EXIF 折叠切换
  previewGrid.querySelectorAll('.exif-toggle').forEach(el => {
    el.addEventListener('click', () => {
      const idx = el.dataset.idx;
      const panel = document.getElementById('exif-edit-' + idx);
      const isOpen = panel.classList.toggle('open');
      el.classList.toggle('open', isOpen);
      el.querySelector('.exif-toggle-label').textContent = isOpen ? '收起 EXIF' : '编辑 EXIF';
    });
  });

  // EXIF 字段编辑
  previewGrid.querySelectorAll('[data-exif]').forEach(el => {
    el.addEventListener('change', () => {
      const idx = parseInt(el.dataset.idx);
      const field = el.dataset.exif;
      if (field === 'date_taken') {
        pendingUploads[idx].date_taken = el.value;
      } else {
        if (!pendingUploads[idx].exif) pendingUploads[idx].exif = {};
        pendingUploads[idx].exif[field] = el.value;
      }
    });
  });
}

/* 确认上传：将编辑后的元数据写回 */
document.getElementById('btn-confirm').addEventListener('click', async () => {
  for (const photo of pendingUploads) {
    await fetch(`/api/photos/${photo.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: photo.title,
        location: photo.location,
        series: photo.series,
        featured: photo.featured,
        date_taken: photo.date_taken || '',
        exif: photo.exif || {},
      }),
    });
  }
  showToast(`已确认 ${pendingUploads.length} 张照片`);
  pendingUploads = [];
  previewGrid.innerHTML = '';
  confirmBar.style.display = 'none';
  closeUploadModal();
  loadManage();
});

/* 取消上传：删除已上传的文件 */
document.getElementById('btn-cancel-upload').addEventListener('click', async () => {
  for (const photo of pendingUploads) {
    await fetch(`/api/photos/${photo.id}`, { method: 'DELETE' });
  }
  pendingUploads = [];
  previewGrid.innerHTML = '';
  confirmBar.style.display = 'none';
  closeUploadModal();
  showToast('已取消');
});

/* ═══════════════════════════════════════════
   系列管理（动态 tab）
   ═══════════════════════════════════════════ */
const seriesTabsEl = document.getElementById('series-tabs');
const btnAddSeries = document.getElementById('btn-add-series');

function renderSeriesTabs() {
  // 移除旧 tab（保留 add 按钮）
  seriesTabsEl.querySelectorAll('[data-series]').forEach(el => el.remove());

  SERIES.forEach(s => {
    const btn = document.createElement('button');
    btn.dataset.series = s.id;
    btn.innerHTML = `${escapeHtml(s.name)}<span class="tab-del" title="删除主题">×</span>`;
    if (s.id === currentManageSeries) btn.classList.add('active');

    btn.addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-del')) return;
      seriesTabsEl.querySelectorAll('[data-series]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentManageSeries = s.id;
      loadManage();
    });

    // 双击重命名
    btn.addEventListener('dblclick', () => startRename(s, btn));

    // 删除
    btn.querySelector('.tab-del').addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = await showConfirm(`确定删除主题「${s.name}」？该主题下的照片将移入未归类。`);
      if (!ok) return;
      await fetch(`/api/series/${s.id}`, { method: 'DELETE' });
      SERIES = SERIES.filter(x => x.id !== s.id);
      if (currentManageSeries === s.id) currentManageSeries = SERIES[0]?.id || '';
      renderSeriesTabs();
      loadManage();
      showToast('主题已删除');
    });

    seriesTabsEl.insertBefore(btn, btnAddSeries);
  });
}

function startRename(s, btn) {
  const input = document.createElement('input');
  input.className = 'tab-rename';
  input.value = s.name;
  btn.replaceWith(input);
  input.focus();
  input.select();

  async function commit() {
    const name = input.value.trim();
    if (name && name !== s.name) {
      await fetch(`/api/series/${s.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      s.name = name;
      showToast('已重命名');
    }
    input.remove();
    renderSeriesTabs();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = s.name; input.blur(); }
  });
}

btnAddSeries.addEventListener('click', async () => {
  const name = await showPrompt('新主题名称：');
  if (!name || !name.trim()) return;
  try {
    const res = await fetch('/api/series', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.trim() }),
    });
    if (!res.ok) { showToast((await res.json()).detail || '创建失败'); return; }
    const entry = await res.json();
    SERIES.push(entry);
    currentManageSeries = entry.id;
    renderSeriesTabs();
    loadManage();
    showToast(`已创建主题「${entry.name}」`);
  } catch (e) { showToast('创建失败'); }
});

async function loadManage() {
  try {
    const res = await fetch(`/api/photos?series=${currentManageSeries}`);
    allPhotos = await res.json();
  } catch (e) { allPhotos = []; }
  renderManage();
}

function renderManage() {
  const featured = allPhotos.filter(p => p.featured);
  const rest = allPhotos;

  manageEmpty.style.display = allPhotos.length ? 'none' : 'block';
  document.getElementById('featured-empty').style.display = featured.length ? 'none' : 'block';

  // 精选列表（可拖拽排序）
  featuredList.innerHTML = '';
  featured.forEach((photo, index) => {
    featuredList.appendChild(createRow(photo, index, true));
  });

  // 全部列表
  allList.innerHTML = '';
  rest.forEach((photo) => {
    allList.appendChild(createRow(photo, -1, false));
  });
}

/* ═══════════════════════════════════════════
   EXIF 展开/收起动画（FLIP + Web Animations API）
   多列（columns）布局重排、以及展开精选卡片时
   下方「全部作品」区域被整体下推，均无法用 CSS 过渡。
   做法：先记录各元素位置（FIRST）→瞬间切到最终态（LAST）
   →用 element.animate() 从旧位置平滑滑向新位置。
   用 WAAPI 而非手动 transition，避免过渡触发时机问题与残留内联样式，
   展开与收起双向均能平滑动画。
   ═══════════════════════════════════════════ */
function animateExifToggle(exifPanel, exifSummaryEl) {
  const scope = document.getElementById('manage-view');
  const willOpen = !exifPanel.classList.contains('open');

  // 尊重系统「减弱动态效果」偏好：直接切换，不做位移动画
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!scope || reduce) {
    exifPanel.classList.toggle('open', willOpen);
    exifSummaryEl.classList.toggle('open', willOpen);
    return;
  }

  // 与全局 UI 保持一致的缓动函数（取 --ease 的实际值，WAAPI 不能直接用 var()）
  const ease = getComputedStyle(document.documentElement).getPropertyValue('--ease').trim()
            || 'cubic-bezier(0.25, 0.1, 0.25, 1)';

  // 参与位移动画的元素：两个列表内的卡片 + 分区标签 + 空状态
  // （精选区展开会把「全部作品」标签及其列表整体下推，一并纳入动画）
  const els = Array.from(scope.querySelectorAll(
    '.section-label, .featured-empty, #manage-empty, #featured-list > .photo-row, #all-list > .photo-row'
  )).filter(el => el.offsetParent !== null);

  // 结束仍在进行的动画，保证位置测量准确（避免快速连点时 transform 叠加）
  els.forEach(el => el.getAnimations().forEach(a => a.finish()));
  exifPanel.getAnimations().forEach(a => a.finish());

  // FIRST：记录动画前各元素位置
  const firstRects = els.map(el => el.getBoundingClientRect());

  // 瞬间切到最终状态（临时禁用面板过渡），让 columns 布局与下游区块一次性排布到位
  exifPanel.style.transition = 'none';
  exifPanel.classList.toggle('open', willOpen);
  exifSummaryEl.classList.toggle('open', willOpen);
  void scope.offsetWidth;
  // 下一帧恢复面板的 CSS 过渡声明（类已应用，不会再触发动画）
  requestAnimationFrame(() => { exifPanel.style.transition = ''; });

  // LAST + PLAY：用 WAAPI 让每个移动过的元素从旧位置平滑滑向新位置
  els.forEach((el, i) => {
    const b = el.getBoundingClientRect();
    const dx = firstRects[i].left - b.left;
    const dy = firstRects[i].top - b.top;
    if (!dx && !dy) return;
    el.animate(
      [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }],
      { duration: 400, easing: ease }
    );
  });

  // 面板内容淡入（展开时），柔化面板瞬间展开
  if (willOpen) {
    exifPanel.animate(
      [{ opacity: 0 }, { opacity: 1 }],
      { duration: 340, easing: 'ease' }
    );
  }
}

function createRow(photo, featuredIdx, isFeaturedSection) {
  const row = document.createElement('div');
  row.className = 'photo-row' + (isFeaturedSection ? ' featured' : '');
  row.dataset.id = photo.id;

  if (isFeaturedSection) {
    row.draggable = true;
  }

  const exif = photo.exif || {};
  const exifSummary = [exif.aperture, exif.shutter_speed, exif.iso].filter(Boolean).join(' ');
  const rowUid = 'row-exif-' + photo.id;

  row.innerHTML = `
    <span class="order-num">${isFeaturedSection ? featuredIdx + 1 : ''}</span>
    <img class="thumb" src="${getThumb(photo)}" alt="" loading="lazy">
    <div class="inputs-wrap">
      <input type="text" value="${escapeHtml(photo.title)}" placeholder="标题" data-field="title">
      <input type="text" value="${escapeHtml(photo.location || '')}" placeholder="地点" data-field="location">
    </div>
    <div class="actions-wrap">
      <button class="star ${photo.featured ? 'on' : ''}" title="精选"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
      <button class="move-series" title="移动主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-8"/><path d="M2 13h10"/><path d="m5 10-3 3 3 3"/></svg></button>
      <button class="del" title="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14zM10 11v6M14 11v6"/></svg></button>
    </div>
    <div class="exif-summary">
      <span class="exif-text">${escapeHtml(exifSummary) || '—'}<br>${photo.date_taken ? escapeHtml(photo.date_taken) : ''}</span>
      <span class="exif-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </div>
  `;

  // EXIF 折叠面板（嵌入行内，跨全列）
  const exifPanel = document.createElement('div');
  exifPanel.className = 'exif-edit';
  exifPanel.id = rowUid;
  exifPanel.innerHTML = `
    <div class="exif-grid">
      <div class="exif-field"><label>相机</label><input type="text" value="${escapeHtml(exif.camera || '')}" data-exif="camera"></div>
      <div class="exif-field"><label>镜头</label><input type="text" value="${escapeHtml(exif.lens || '')}" data-exif="lens"></div>
      <div class="exif-field"><label>焦距</label><input type="text" value="${escapeHtml(exif.focal_length || '')}" data-exif="focal_length"></div>
      <div class="exif-field"><label>光圈</label><input type="text" value="${escapeHtml(exif.aperture || '')}" data-exif="aperture"></div>
      <div class="exif-field"><label>快门</label><input type="text" value="${escapeHtml(exif.shutter_speed || '')}" data-exif="shutter_speed"></div>
      <div class="exif-field"><label>ISO</label><input type="text" value="${escapeHtml(exif.iso || '')}" data-exif="iso"></div>
      <div class="exif-field"><label>拍摄日期</label><input type="text" value="${escapeHtml(photo.date_taken || '')}" data-exif="date_taken"></div>
    </div>
  `;

  // EXIF 折叠切换（FLIP 平滑重排动画）
  const exifSummaryEl = row.querySelector('.exif-summary');
  exifSummaryEl.addEventListener('click', () => {
    animateExifToggle(exifPanel, exifSummaryEl);
  });

  // EXIF 字段编辑 → PATCH API
  exifPanel.querySelectorAll('[data-exif]').forEach(el => {
    el.addEventListener('change', async () => {
      const field = el.dataset.exif;
      if (field === 'date_taken') {
        photo.date_taken = el.value;
        await fetch(`/api/photos/${photo.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date_taken: el.value }),
        });
      } else {
        if (!photo.exif) photo.exif = {};
        photo.exif[field] = el.value;
        await fetch(`/api/photos/${photo.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ exif: { [field]: el.value } }),
        });
      }
      showToast('EXIF 已保存');
    });
  });

  // 元数据编辑
  row.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('change', async () => {
      const field = el.dataset.field;
      photo[field] = el.value;
      await fetch(`/api/photos/${photo.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: el.value }),
      });
      showToast('已保存');
    });
  });

  // 精选切换
  row.querySelector('.star').addEventListener('click', async (e) => {
    const newState = !photo.featured;
    photo.featured = newState;
    e.currentTarget.classList.toggle('on', newState);
    await fetch(`/api/photos/${photo.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ featured: newState }),
    });
    renderManage();
    showToast(newState ? '已标记精选' : '已取消精选');
  });

  // 删除
  row.querySelector('.del').addEventListener('click', async () => {
    const ok = await showConfirm(`确定删除「${photo.title}」？文件将被移除。`);
    if (!ok) return;
    await fetch(`/api/photos/${photo.id}`, { method: 'DELETE' });
    allPhotos = allPhotos.filter(p => p.id !== photo.id);
    renderManage();
    showToast('已删除');
  });

  // 移动主题
  const moveBtn = row.querySelector('.move-series');
  moveBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    // 关闭其他已打开的下拉
    document.querySelectorAll('.move-dropdown').forEach(d => d.remove());
    const rect = moveBtn.getBoundingClientRect();
    const dropdown = document.createElement('div');
    dropdown.className = 'move-dropdown';
    dropdown.style.top = (rect.bottom + 4) + 'px';
    dropdown.style.left = Math.max(8, rect.right - 120) + 'px';
    SERIES.forEach(s => {
      const btn = document.createElement('button');
      btn.textContent = s.name;
      if (s.id === currentManageSeries) btn.classList.add('current');
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        dropdown.remove();
        if (s.id === currentManageSeries) return;
        await fetch(`/api/photos/${photo.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ series: s.id }),
        });
        allPhotos = allPhotos.filter(p => p.id !== photo.id);
        renderManage();
        showToast(`已移至「${s.name}」`);
      });
      dropdown.appendChild(btn);
    });
    document.body.appendChild(dropdown);
    // 点击外部关闭
    const closeDropdown = (ev) => {
      if (!dropdown.contains(ev.target) && ev.target !== moveBtn) { dropdown.remove(); document.removeEventListener('click', closeDropdown); }
    };
    setTimeout(() => document.addEventListener('click', closeDropdown), 0);
  });

  // 拖拽排序（仅精选区）
  if (isFeaturedSection) {
    row.addEventListener('dragstart', (e) => {
      row.classList.add('dragging');
      e.dataTransfer.setData('text/plain', photo.id);
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      featuredList.querySelectorAll('.photo-row').forEach(r => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const dragId = e.dataTransfer.getData('text/plain');
      if (dragId === photo.id) return;

      // 重排 allPhotos 中精选照片的顺序
      const featured = allPhotos.filter(p => p.featured);
      const fromIdx = featured.findIndex(p => p.id === dragId);
      const toIdx = featured.findIndex(p => p.id === photo.id);
      const [moved] = featured.splice(fromIdx, 1);
      featured.splice(toIdx, 0, moved);

      // 重建 allPhotos：精选按新顺序在前，非精选保持原序
      const nonFeatured = allPhotos.filter(p => !p.featured);
      allPhotos = [...featured, ...nonFeatured];
      renderManage();
      // 自动保存排序
      const featuredIds = featured.map(p => p.id);
      fetch('/api/photos/order', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: featuredIds }),
      }).then(() => showToast('排序已保存')).catch(() => showToast('排序保存失败'));
    });
  }

  row.appendChild(exifPanel);
  const frag = document.createDocumentFragment();
  frag.appendChild(row);
  return frag;
}

/* ═══════════════════════════════════════════
   工具
   ═══════════════════════════════════════════ */
function escapeHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

/* 自定义确认弹窗（替代原生 confirm） */
function showConfirm(msg) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('modal-overlay');
    const box = document.getElementById('modal-box');
    box.querySelector('.modal-msg').textContent = msg;
    overlay.classList.add('show');

    const confirmBtn = box.querySelector('.modal-confirm');
    const cancelBtn = box.querySelector('.modal-cancel');

    function cleanup(result) {
      overlay.classList.remove('show');
      confirmBtn.removeEventListener('click', onConfirm);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlay);
      resolve(result);
    }
    function onConfirm() { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onOverlay(e) { if (e.target === overlay) cleanup(false); }

    confirmBtn.addEventListener('click', onConfirm);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlay);
  });
}

/* 自定义输入弹窗（替代原生 prompt） */
function showPrompt(msg, placeholder) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('modal-overlay');
    const box = document.getElementById('modal-box');
    const input = box.querySelector('.modal-input');
    const confirmBtn = box.querySelector('.modal-confirm');
    const cancelBtn = box.querySelector('.modal-cancel');

    box.querySelector('.modal-msg').textContent = msg;
    input.style.display = 'block';
    input.value = '';
    input.placeholder = placeholder || '';
    confirmBtn.textContent = '确定';
    confirmBtn.style.background = 'rgba(255,255,255,0.12)';
    confirmBtn.style.borderColor = 'rgba(255,255,255,0.25)';
    overlay.classList.add('show');
    setTimeout(() => input.focus(), 50);

    function cleanup(result) {
      overlay.classList.remove('show');
      input.style.display = 'none';
      confirmBtn.textContent = '删除';
      confirmBtn.style.background = '';
      confirmBtn.style.borderColor = '';
      confirmBtn.removeEventListener('click', onConfirm);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onOverlay);
      input.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onConfirm() { cleanup(input.value); }
    function onCancel() { cleanup(null); }
    function onOverlay(e) { if (e.target === overlay) cleanup(null); }
    function onKey(e) {
      if (e.key === 'Enter') cleanup(input.value);
      if (e.key === 'Escape') cleanup(null);
    }

    confirmBtn.addEventListener('click', onConfirm);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onOverlay);
    input.addEventListener('keydown', onKey);
  });
}

/* ═══════════════════════════════════════════
   初始化
   ═══════════════════════════════════════════ */
(async function init() {
  try {
    const res = await fetch('/api/series');
    const data = await res.json();
    SERIES = data.map(s => ({ id: s.id, name: s.name }));
  } catch (e) { SERIES = []; }
  if (SERIES.length) currentManageSeries = SERIES[0].id;
  renderSeriesTabs();
  loadManage();

  // 窗口缩放时重新布局
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => layoutAll(true), 100);
  });
})();
</script>
