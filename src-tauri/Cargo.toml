[package]
name = "photo-gallery"
version = "2.1.0"
description = "拾光 · 摄影画廊桌面版"
edition = "2021"

[lib]
name = "photo_gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }

[profile.release]
# 桌面分发：体积优先
strip = true
lto = true
codegen-units = 1
panic = "abort"

# debug 构建下依赖库也按优化编译：image 解码/缩放 O0 时慢 10~50 倍
# 仅首次全量编译变慢，自身代码增量编译速度不受影响
[profile.dev.package."*"]
opt-level = 3
